<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d9488" />
  <title>فینورا پرو | سامانه حسابداری و صدور فاکتور</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/misc/Farsi-Digits/Vazirmatn-FD-font-face.css" />
  <link rel="stylesheet" href="/src/styles/main.css" />
</head>
<body>
  <div id="app" class="app">
    <div id="splash">
      <div class="splash-logo">فینورا پرو</div>
      <div class="splash-spinner"></div>
    </div>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-logo">فینورا</div>
        <div class="brand-text hide-on-collapse">
          <h1>فینورا پرو</h1>
          <small>نسخه ۰.۱.۰</small>
        </div>
      </div>

      <ul class="sidebar-menu" id="sidebarMenu">
        <li><a data-page="dashboard"><span class="icon">📊</span><span class="label">داشبورد</span></a></li>
        <li><a data-page="invoices"><span class="icon">🧾</span><span class="label">فاکتورها</span></a></li>
        <li><a data-page="products"><span class="icon">📦</span><span class="label">کالا و انبار</span></a></li>
        <li><a data-page="contacts"><span class="icon">👥</span><span class="label">اشخاص</span></a></li>
        <li><a data-page="treasury"><span class="icon">🏦</span><span class="label">خزانه و بانک</span></a></li>
        <li><a data-page="cheques"><span class="icon">💳</span><span class="label">چک‌ها</span></a></li>
        <li><a data-page="expenses"><span class="icon">💰</span><span class="label">هزینه و درآمد</span></a></li>
        <li><a data-page="reports"><span class="icon">📈</span><span class="label">گزارش سود و زیان</span></a></li>
        <li><a data-page="settings"><span class="icon">⚙️</span><span class="label">تنظیمات</span></a></li>
      </ul>

      <div class="sidebar-footer">
        <div class="user-chip">
          <div class="user-avatar" id="userAvatar">م</div>
          <div class="user-info">
            <strong id="userName">مدیر سیستم</strong>
            <small id="userRole">Admin</small>
          </div>
          <button class="icon-btn hide-on-collapse" onclick="FINORA.Auth.logout()" title="خروج" style="width:32px;height:32px;font-size:14px">🚪</button>
        </div>
      </div>
    </aside>

    <main class="main" id="main">
      <header class="header">
        <button class="hamburger" onclick="document.getElementById('sidebar').classList.toggle('collapsed');document.getElementById('main').classList.toggle('sidebar-collapsed')">☰</button>

        <div class="header-title">
          <h2 id="pageTitle">داشبورد</h2>
          <small id="greeting">در حال بارگذاری...</small>
        </div>

        <div class="header-stats">
          <div class="stat-chip"><strong id="statInvoices">۰</strong><small>فاکتور</small></div>
          <div class="stat-chip"><strong id="statContacts">۰</strong><small>شخص</small></div>
          <div class="stat-chip"><strong id="statProducts">۰</strong><small>کالا</small></div>
        </div>

        <div class="header-tools">
          <button class="icon-btn" id="themeToggleBtn" onclick="FINORA.Theme.toggle()" title="تغییر تم">🌙</button>
        </div>
      </header>

      <div class="content" id="pageContent"></div>
    </main>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
