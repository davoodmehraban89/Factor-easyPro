name: Prepare vendored offline assets (single use)
on:
  push:
    branches: ['fix/a07-offline-bundled-assets']
    paths:
      - '.github/workflows/a07-vendor-assets.yml'
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked existing project dependencies
        run: npm ci
      - name: Vendor the official SheetJS 0.20.3 tarball from upstream
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor
          curl -fL --retry 3 --connect-timeout 15 --max-time 120 \
            https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz \
            -o vendor/xlsx-0.20.3.tgz
          test "$(wc -c < vendor/xlsx-0.20.3.tgz)" -gt 100000
          (cd vendor && sha256sum xlsx-0.20.3.tgz > SHA256SUMS.txt)
      - name: Install local SheetJS and pinned self-hosted Persian font
        shell: bash
        run: |
          npm install --save-exact ./vendor/xlsx-0.20.3.tgz
          npm install --save-exact @fontsource/vazirmatn@5.3.0
          npm ci
      - name: Verify offline Excel and existing accounting regressions
        run: npm test
      - name: Verify packaged fonts and frontend
        run: npm run build
      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Commit pinned vendored assets and dependency lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json vendor/xlsx-0.20.3.tgz vendor/SHA256SUMS.txt
          git commit -m 'build(A07): vendor offline SheetJS and Vazirmatn dependencies'
          git push origin HEAD:fix/a07-offline-bundled-assets
