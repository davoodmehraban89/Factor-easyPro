name: PR Quality Gates — accounting, Windows and packaging

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  node-quality:
    name: Tests, frontend build and production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout immutable PR snapshot
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Clean install
        run: npm ci
      - name: Full automated regression suite
        run: npm test
      - name: Build frontend bundle
        run: npm run build
      - name: Audit production dependencies for high or critical advisories
        run: npm audit --omit=dev --audit-level=high

  windows-installer:
    name: Windows native build and preview artifact (not a release)
    needs: node-quality
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - name: Checkout immutable PR snapshot
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Clean install
        run: npm ci
      - name: Windows integration regression
        run: npm test
      - name: A02 SQL backup preflight selftest (read-only; no SQL instance/data)
        shell: pwsh
        run: |
          $output = & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File './scripts/a02-sql-backup-readonly-preflight.ps1' -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'A02 PowerShell selftest failed' }
          $result = ($output | Out-String | ConvertFrom-Json)
          if ($result.status -ne 'selftest-passed' -or $result.databaseModified -ne $false -or $result.canImport -ne $false -or $result.connectionOpened -ne $false) {
            throw 'A02 PowerShell selftest safety result invalid'
          }
      - name: Guarded SQL restore helper self-test (no SQL, no backup, zero writes)
        shell: pwsh
        run: |
          $result = & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File './scripts/a02-isolated-sql-restore.ps1' -Mode Test
          if ($LASTEXITCODE -ne 0) { throw 'A02 isolated restore synthetic self-test failed' }
          $report = ($result | Out-String | ConvertFrom-Json)
          if ($report.status -ne 'selftest-passed' -or
              $report.sqlConnectionOpened -ne $false -or
              $report.backupOpened -ne $false -or
              $report.databaseModified -ne $false -or
              $report.canImport -ne $false) {
            throw 'A02 unsafe self-test result'
          }
      - name: Holoo ZIP private staging regression (synthetic only)
        shell: pwsh
        run: |
          $output = & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File './scripts/a02-private-holoo-zip-staging.ps1' -Mode Test
          if ($LASTEXITCODE -ne 0) { throw 'A02 private ZIP staging selftest failed' }
          $report = ($output | Out-String | ConvertFrom-Json)
          if ($report.status -ne 'synthetic-zip-staging-selftest-passed' -or
              $report.ownerBackupUsed -ne $false -or
              $report.sqlConnected -ne $false -or
              $report.financialDataImported -ne $false -or
              $report.canImport -ne $false) {
            throw 'A02 ZIP staging synthetic selftest safety contract failed'
          }
      - name: Verify SQL media preflight refuses unsafe input (synthetic; no engine setup)
        shell: pwsh
        run: |
          $output = & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File './scripts/a02-offline-sql-setup-preflight.ps1' -Mode Test
          if ($LASTEXITCODE -ne 0) { throw 'A02 offline SQL preflight synthetic selftest failed' }
          $result = ($output | Out-String | ConvertFrom-Json)
          if ($result.status -ne 'synthetic-offline-sql-setup-preflight-passed' -or
              $result.installerStarted -ne $false -or
              $result.registryRead -ne $false -or
              $result.backupOpened -ne $false -or
              $result.databaseModified -ne $false -or
              $result.canImport -ne $false) {
            throw 'A02 SQL offline preflight selftest breached no-write contract'
          }
      - name: Isolated schema fingerprint safety selftest (synthetic; no SQL)
        shell: pwsh
        run: |
          $out = & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File './scripts/a02-isolated-schema-inventory.ps1' -Mode Test
          if ($LASTEXITCODE -ne 0) { throw 'A02 schema inventory selftest failed' }
          $s = ($out | Out-String | ConvertFrom-Json)
          if ($s.status -ne 'schema-fingerprint-selftest-passed' -or
              $s.sqlOpened -ne $false -or $s.userRowsRead -ne $false -or
              $s.databaseModified -ne $false -or $s.canImport -ne $false) {
            throw 'A02 schema inventory selftest safety breach'
          }
      - name: Actual synthetic SQL LocalDB backup and isolated restore
        shell: pwsh
        run: |
          $output = & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File './scripts/a02-synthetic-sql-localdb-restore-smoke.ps1' -Mode Run
          if ($LASTEXITCODE -ne 0) { throw 'A02 synthetic SQL LocalDB live restore failed' }
          $report = ($output | Out-String | ConvertFrom-Json)
          if ($report.status -ne 'synthetic-localdb-restore-verified' -or
              $report.ownerBackupUsed -ne $false -or
              $report.restoreExecuted -ne $true -or
              $report.dbccPassed -ne $true -or
              $report.syntheticRecords -ne 2 -or
              $report.syntheticTotal -ne 80235 -or
              $report.schemaOnlyInventoryVerified -ne $true -or
              $report.privateManifestRoundTripVerified -ne $true -or
              $report.canImport -ne $false) {
            throw 'A02 synthetic LocalDB restore did not satisfy safety/reconciliation contract'
          }
      - name: Build Tauri installer
        run: npm exec tauri build
      - name: Inspect produced Windows x64 installer and checksum
        shell: pwsh
        run: |
          $files = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis/*x64-setup.exe' -ErrorAction SilentlyContinue)
          if ($files.Count -ne 1) { throw 'Exactly one x64 NSIS installer is required' }
          $file=$files[0]
          if ($file.Length -lt 100000) { throw 'Installer suspiciously small' }
          $hash=(Get-FileHash $file.FullName -Algorithm SHA256).Hash
          $hash + '  ' + $file.Name | Out-File -FilePath SHA256SUMS.txt -Encoding ascii
          Write-Output ('PREVIEW_INSTALLER=' + $file.Name + ' SIZE=' + $file.Length + ' SHA256=' + $hash)
      - name: Upload preview installer for review (no public release)
        uses: actions/upload-artifact@v4
        with:
          name: factor-easypro-windows-pr-preview
          path: |
            src-tauri/target/release/bundle/nsis/*x64-setup.exe
            SHA256SUMS.txt
          retention-days: 7
          if-no-files-found: error
