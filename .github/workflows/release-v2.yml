name: Build and publish Factor-easyPro v2.0.0
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v2.yml'
permissions:
  contents: write
jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2.0.0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Automated tests
        run: npm test
      - name: Build native Windows installer
        run: npm exec tauri build
      - name: Generate independent installer checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*2.0.0*x64-setup.exe' | Select-Object -First 1
          if (!$installer) { throw 'Windows installer missing' }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash
          $hash + '  ' + $installer.Name | Out-File -FilePath SHA256SUMS.txt -Encoding ascii
          Write-Output ('SHA256=' + $hash)
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          gh release view v2.0.0 --json id *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create v2.0.0 --draft --title 'Factor-easyPro 2.0.0 — Windows x64' --notes-file RELEASE_NOTES_FA.md
            if ($LASTEXITCODE -ne 0) { throw 'Cannot create draft release' }
          }
          gh release upload v2.0.0 'src-tauri/target/release/bundle/nsis/Factor-easyPro_2.0.0_x64-setup.exe' SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release assets upload failed' }
          gh release edit v2.0.0 --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish release' }
          gh release view v2.0.0 --json url,isDraft,assets
          if ($LASTEXITCODE -ne 0) { throw 'Release verification failed' }
