أ¯آ»طںname: A08 installed Windows memory stability (reuse NSIS)
on:
  push:
    branches: [work/a08-memory-stability-20261123]
    paths:
      - '.github/workflows/a08-installed-memory-stability.yml'
      - 'tests/windows-vm-native-memory-stability-browser.js'
      - 'tests/windows-vm-installed-tauri-cdp.cjs'
      - 'scripts/windows-vm-targeted-a08.ps1'
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: 'Native Windows workflow run holding candidate NSIS from this exact commit'
        required: true
        type: string
      source_sha:
        description: 'Exact 40-character commit SHA used to build the installer (not the workflow dispatch SHA)'
        required: true
        type: string
      expected_version:
        description: 'Candidate installer version from that run'
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  targeted-native-a08:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/work/a08-memory-stability-20261123'
    runs-on: windows-latest
    timeout-minutes: 160
    steps:
      # Checkout the separately reviewed QA harness; verify the immutable
      # binary-producing source SHA independently against its successful run.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify artifact source SHA and workflow identity
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.artifact_run_id || '45243530762' }}
          SOURCE_SHA: ${{ inputs.source_sha || '25faa1548536572d4a2199fe9c11fea9c1029b6f' }}
          EXPECTED_VERSION: ${{ inputs.expected_version || '2.0.4' }}
        run: |
          if ($env:SOURCE_RUN -notmatch '^[0-9]+$') { throw 'Invalid source run ID' }
          if ($env:SOURCE_SHA -notmatch '^[a-fA-F0-9]{40}$') { throw 'Invalid source commit SHA' }
          if ((git rev-parse HEAD).Trim() -eq $env:SOURCE_SHA) { throw 'Stability harness must be a separately reviewed QA revision' }
          if ($env:EXPECTED_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid candidate version' }
          $run=gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN" | ConvertFrom-Json
          if ($run.head_sha -ne $env:SOURCE_SHA -or $run.status -ne 'completed' -or
              $run.conclusion -ne 'success' -or $run.event -notin @('pull_request','push','workflow_dispatch') -or
              $run.path -notmatch 'windows-vm-native-lab.yml') {
            throw 'Source must be a completed native lab run on exactly this commit'
          }
          Write-Host ("Verified candidate run "+$run.html_url+" SHA "+$run.head_sha)
      - name: Reuse already-built candidate NSIS
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.artifact_run_id || '45243530762' }}
          github-token: ${{ github.token }}
          name: phase-a-native-candidate-nsis
          path: test-installer
      - name: Run ten real installed WebView2 A08 memory cycles
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version || '2.0.4' }}
        run: |
          $files=@(Get-ChildItem test-installer -Recurse -Filter '*x64-setup.exe')
          if ($files.Count -ne 1) { throw 'Expected exactly one reused NSIS installer' }
          ./scripts/windows-vm-targeted-a08.ps1 -Installer $files[0].FullName -ExpectedVersion $env:EXPECTED_VERSION -Mode stability
      - name: Run 120-minute installed endurance after short smoke
        shell: pwsh
        env:
          A08_ENDURANCE: '1'
          EXPECTED_VERSION: ${{ inputs.expected_version || '2.0.4' }}
        run: |
          $lab=Join-Path $env:RUNNER_TEMP 'factor-a08-targeted-native'
          Move-Item $lab "$lab-smoke"
          $files=@(Get-ChildItem test-installer -Recurse -Filter '*x64-setup.exe')
          ./scripts/windows-vm-targeted-a08.ps1 -Installer $files[0].FullName -ExpectedVersion $env:EXPECTED_VERSION -Mode stability
      - name: Upload targeted native A08 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a08-installed-memory-stability-evidence
          path: |
            ${{ runner.temp }}/factor-a08-targeted-native/reports/*.json
            ${{ runner.temp }}/factor-a08-targeted-native-smoke/reports/*.json
          retention-days: 14
          if-no-files-found: warn
